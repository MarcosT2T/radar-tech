name: Checagem diária de fontes
on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar catálogo
        run: python scripts/validate.py
      - name: Consultar páginas de origem
        run: python scripts/check_sources.py
